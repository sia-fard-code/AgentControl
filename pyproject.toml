[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control"
version = "0.2.0"
description = "Machine-wide delegated-agent monitoring and accounting"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
agent-control = "agent_control.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["harness_process_identity"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
