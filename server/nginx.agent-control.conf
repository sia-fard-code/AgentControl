# Merge these server blocks into the existing nginx.conf's http block.
# This is not a complete nginx.conf; preserve all existing virtual hosts.
# Keep this hostname in sync with compose.agent-control.nginx.yml.
server {
    listen 80;
    server_name agent-control.example.com;
    access_log off;
    error_log /dev/null;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://agent-control.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name agent-control.example.com;

    ssl_certificate /etc/letsencrypt/live/agent-control.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-control.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "AgentControl";
    auth_basic_user_file /etc/nginx/agent-control.htpasswd;
    access_log off;
    error_log /dev/null;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_in_file_only off;

    location / {
        # AgentControl shares this container's network namespace, not its files.
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve the browser's Origin and CSRF headers; never invent them.
        # Narration and guidance must not be cached or spooled to proxy files.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_store off;
    }
}
